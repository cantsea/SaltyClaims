  help-tools: 'Tools: {selection} for claims, {child-selection} for child claims, {inspection} to inspect.'
  help-player: |-
    Right-click two opposite corners to create a claim.
    Use the child claim tool inside your own claim. Same Y: full height; different Y: 3D.
    To resize, click an owned corner with its tool, then the new corner.
    Switching away or a failed attempt clears your selection.
    Stand in a claim to use trust and management commands.
