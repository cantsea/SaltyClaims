# Root claims cover full world height. Children may be full height or 3D.
claims:
  starting-blocks: 10000
  minimum-width: 3
  maximum-roots: 20
  maximum-children: 100
  maximum-area: 1000000
# Allowance accrual is not enabled; admins can adjust bonus blocks.
tools:
  selection: STICK
  child-selection: BONE
  inspection: FEATHER
selection-timeout-seconds: 120
# How long selection and inspection borders repeat (0 disables particles; maximum 300).
particle-duration-seconds: 10
# Particle border colors. Use quoted #RRGGBB hex colors, then /claima reload.
border-colors:
  parent: '#FFFF00'
  child: '#00FFFF'
# Claim behavior switches: false denies the behavior, including for the owner.
# true permits it, subject to the normal trust requirement listed below.
# Visitors have no trust; Access < Container < Build < Manage < Owner.
# Manage can delegate lower trust and create children; only owners edit flags.
# New children keep only the parent owner and their creating manager's trust.
# Children use their own flag overrides or these defaults; parent flags never apply.
# player-editable: false locks this flag to its configured default in every claim.
# player-editable: true lets owners with the flag permission toggle it locally.
# Wilderness rules and world claiming switches are exclusively in worlds.yml.
claim-flags:
  # Requires Build trust or higher when enabled.
  block-break:
    default: true
    player-editable: false
  # Requires Build trust or higher when enabled.
  block-place:
    default: true
    player-editable: false
  # Requires Container trust or higher when enabled.
  container-use:
    default: true
    player-editable: false
  # Requires Access trust or higher when enabled.
  door-use:
    default: true
    player-editable: false
  # Requires Access trust or higher when enabled.
  switch-use:
    default: true
    player-editable: false
  # Requires Access trust or higher when enabled.
  bed-use:
    default: true
    player-editable: false
  # Requires Container trust or higher when enabled.
  utility-use:
    default: true
    player-editable: false
  # Requires Container trust or higher when enabled.
  crop-harvest:
    default: true
    player-editable: false
  # Requires Container trust or higher when enabled.
  crop-replant:
    default: true
    player-editable: false
  # Requires Build trust or higher when enabled.
  bucket-use:
    default: true
    player-editable: false
  # Requires Container trust or higher when enabled.
  animal-interact:
    default: true
    player-editable: false
  # Requires Build trust or higher when enabled.
  animal-damage:
    default: true
    player-editable: false
  # Requires Build trust or higher when enabled.
  decoration-edit:
    default: true
    player-editable: false
  # Requires Build trust or higher when enabled.
  vehicle-edit:
    default: true
    player-editable: false
  # Requires Access trust or higher when enabled.
  vehicle-use:
    default: true
    player-editable: false
  # Requires Build trust or higher when enabled.
  ignite:
    default: true
    player-editable: false
  # Environment/boundary behavior; independent of player trust.
  pvp:
    default: false
    player-editable: false
  # Environment/boundary behavior; independent of player trust.
  explosion-block-damage:
    default: false
    player-editable: false
  # Environment/boundary behavior; independent of player trust.
  explosion-entity-damage:
    default: false
    player-editable: false
  # Environment/boundary behavior; independent of player trust.
  fire-spread:
    default: false
    player-editable: false
  # Environment/boundary behavior; independent of player trust.
  mob-block-grief:
    default: false
    player-editable: false
  # Environment/boundary behavior; independent of player trust.
  fluid-crossing:
    default: false
    player-editable: false
  # Environment/boundary behavior; independent of player trust.
  piston-crossing:
    default: false
    player-editable: false
  # Environment/boundary behavior; independent of player trust.
  hopper-crossing:
    default: false
    player-editable: false

# Independent configuration schema version. Managed automatically; do not edit.
config-version: 8
