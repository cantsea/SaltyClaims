name: SaltyClaims
version: '${version}'

main: org.saltymc.SaltyClaims
api-version: '26.3'
load: POSTWORLD

authors: [ cantsea ]
description: Lightweight full-height claims, 3D subdivisions, trust, and native flags.
commands:
  claim:
    description: Player claim commands.
    usage: /claim help
  claima:
    description: Administrative claim commands.
    usage: /claima help
  unclaim:
    description: Remove your current claim or all of your claims.
    usage: /unclaim [all]
  claimflag:
    description: Toggle an editable flag in your claim.
    usage: /claimflag toggle [flag]
  claimflags:
    description: List the claim flags you can edit here.
    usage: /claimflags
  trust:
    description: Grant claim trust to a player or everyone; defaults to Access.
    usage: /trust <player|public> [access|container|build|manage]
  untrust:
    description: Remove local claim trust from a player or everyone.
    usage: /untrust <player|public|all>
